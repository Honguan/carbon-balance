name: Agent source bridge

on:
  push:
    branches:
      - agent/complete-issues-21-30-v1.0.0
    paths:
      - .github/workflows/agent-bridge.yml
      - .agent/patch.diff

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect patch mode
        id: mode
        shell: bash
        run: |
          if [[ -f .agent/patch.diff ]]; then
            echo 'patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'patch=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply verified patch
        if: steps.mode.outputs.patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .agent/patch.diff
          git apply .agent/patch.diff
          rm -f .agent/patch.diff
          git add -A
          git config user.name 'carbon-balance-agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: complete governance issues 21-30'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Package branch source
        if: steps.mode.outputs.patch != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=source-bridge.tar.gz -czf source-bridge.tar.gz .
      - name: Upload branch source
        if: steps.mode.outputs.patch != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: carbon-balance-source
          path: source-bridge.tar.gz
          retention-days: 1
