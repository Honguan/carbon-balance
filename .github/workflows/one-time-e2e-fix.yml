name: One-time inventory null-safety fix

on:
  push:
    branches:
      - agent/complete-issues-21-30-v1.0.0

permissions:
  contents: write

jobs:
  fix-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-issues-21-30-v1.0.0
          fetch-depth: 0
      - name: Fix optional exclusions and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          page = Path('src/CarbonFootprint.Web/Pages/Workspace.cshtml.cs')
          text = page.read_text(encoding='utf-8')
          old = '                exclusions.Trim()),'
          new = '                exclusions?.Trim() ?? string.Empty),'
          if old not in text:
              raise SystemExit('Expected inventory exclusions expression was not found.')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/one-time-e2e-fix.yml').unlink()
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: handle optional inventory exclusions"
          git push origin HEAD:agent/complete-issues-21-30-v1.0.0
