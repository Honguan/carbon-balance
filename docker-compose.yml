name: carbon-footprint

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbon_footprint}
      POSTGRES_USER: ${POSTGRES_USER:-carbon_app}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; run the local setup script or create .env}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-s3.port=9000", "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0", "-s3.port.lance=0", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:-carbon_storage}}
      AWS_SECRET_ACCESS_KEY: "${OBJECT_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?OBJECT_STORAGE_SECRET_KEY is required; run the local setup script or create .env}}"
      S3_BUCKET: ${OBJECTSTORAGE__BUCKET:-carbon-evidence}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data

  clamav:
    image: clamav/clamav:1.5-debian13-slim@sha256:a73435b0fa51886e9e6dd1881656023ba9dce756e055f23981270badbb8ca3d7
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  migrate:
    image: carbon-footprint-app:local
    build:
      context: .
      dockerfile: src/CarbonFootprint.Web/Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-carbon_footprint};Username=${POSTGRES_USER:-carbon_app};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; run the local setup script or create .env}"
      ADMINISTRATORBOOTSTRAP__TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  factor-sync:
    image: carbon-footprint-app:local
    build:
      context: .
      dockerfile: src/CarbonFootprint.Web/Dockerfile
    command: ["--sync-factors", "--deployment"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-carbon_footprint};Username=${POSTGRES_USER:-carbon_app};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; run the local setup script or create .env}"
      EXTERNALFACTORSOURCES__MOENV__APIKEY: ${MOENV_API_KEY:-}
      EXTERNALFACTORSOURCES__MOENV__IMPORTONDEPLOYMENT: ${MOENV_IMPORT_ON_DEPLOYMENT:-true}
      ADMINISTRATORBOOTSTRAP__TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    image: carbon-footprint-app:local
    build:
      context: .
      dockerfile: src/CarbonFootprint.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-carbon_footprint};Username=${POSTGRES_USER:-carbon_app};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; run the local setup script or create .env}"
      OBJECTSTORAGE__ENDPOINT: http://object-storage:9000
      OBJECTSTORAGE__BUCKET: ${OBJECTSTORAGE__BUCKET:-carbon-evidence}
      OBJECTSTORAGE__ACCESSKEY: ${OBJECT_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:-carbon_storage}}
      OBJECTSTORAGE__SECRETKEY: "${OBJECT_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?OBJECT_STORAGE_SECRET_KEY is required; run the local setup script or create .env}}"
      MALWARESCANNER__HOST: clamav
      MALWARESCANNER__PORT: 3310
      MAIL__HOST: mailpit
      MAIL__PORT: 1025
      MAIL__DEVELOPMENTMAILPIT__HOST: mailpit
      MAIL__DEVELOPMENTMAILPIT__PORT: 1025
      MAIL__DEVELOPMENTMAILPIT__ADDRESSRANGES__0: 172.16.0.0/12
      MAIL__DEVELOPMENTMAILPIT__ADDRESSRANGES__1: 192.168.0.0/16
      EXTERNALFACTORSOURCES__MOENV__APIKEY: ${MOENV_API_KEY:-}
      ADMINISTRATORBOOTSTRAP__TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - data-protection-keys:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
      clamav:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  object-storage-data:
  mailpit-data:
  data-protection-keys:
  clamav-data:
